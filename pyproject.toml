[project]
name = "bedrock-tools"
version = "0.1.0"
description = "Scripts and hooks of the bedrock Claude Code plugin"
requires-python = ">=3.12"

[tool.black]
line-length = 100
# The ported code-review skill keeps its own style; it is maintained as a unit.
extend-exclude = "plugins/bedrock/skills/(code-review|design-creator|humanize)"
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "plugins/bedrock/skills/code-review",
    "plugins/bedrock/skills/design-creator",
    "plugins/bedrock/skills/humanize",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE", "C90", "D"]
ignore = ["D203", "D213"]
# Russian text is a first-class input here; its letters are not homoglyph attacks.
allowed-confusables = ["а", "в", "г", "е", "к", "м", "н", "о", "р", "с", "т", "у", "х", "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/app/tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
